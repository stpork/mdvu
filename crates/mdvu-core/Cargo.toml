[package]
name = "mdvu-core"
version = "0.4.1"
edition = "2021"
description = "Core high-performance Markdown processing and offline diagram engine for MDVu"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
regex = "1.10"
memchr = "2.7"
lzma-rs = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"

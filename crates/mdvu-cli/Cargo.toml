[package]
name = "mdvu-cli"
version = "0.4.1"
edition = "2021"
description = "Lightning-fast headless CLI markdown renderer for MDVu"
license = "MIT"

[[bin]]
name = "mdvu-cli"
path = "src/main.rs"

[dependencies]
mdvu-core = { path = "../mdvu-core" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"

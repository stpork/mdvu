[package]
name = "mdvu-windows"
version = "0.4.1"
edition = "2021"
description = "Superfast, lightweight native Markdown viewer for Windows (powered by WebView2 & mdvu-core)"
license = "MIT"

[[bin]]
name = "mdvu-windows"
path = "src/main.rs"

[dependencies]
mdvu-core = { path = "../mdvu-core" }
tao = "0.30"
wry = "0.47"
notify = "6.1"
rfd = "0.15"
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[build-dependencies]

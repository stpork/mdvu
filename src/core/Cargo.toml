[package]
name = "mdvu-core"
version = "0.5.2"
edition = "2021"
description = "Core high-performance Markdown processing and offline diagram engine for MDVu"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Release .app resources; do not enable for standalone DLL/EXE consumers.
bundle-assets = []

[dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html", "simd"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
memchr = "2.8.3"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "optimization"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dunce = "1.0.5"
linkify = "0.11.0"
getrandom = "0.4.3"

[target.'cfg(windows)'.dependencies]
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

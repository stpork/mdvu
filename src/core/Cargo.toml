[package]
name = "mdvu-core"
version = "0.5.0"
edition = "2021"
description = "Core high-performance Markdown processing and offline diagram engine for MDVu"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Release .app resources; do not enable for standalone DLL/EXE consumers.
bundle-assets = []

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
regex = { version = "1.10", default-features = false, features = ["std", "perf"] }
memchr = "2.7"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dunce = "1.0"
linkify = "0.10"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
url = "2.5"

[dev-dependencies]
tempfile = "3.10"

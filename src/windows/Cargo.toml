[package]
name = "mdvu-windows"
version = "0.5.2"
edition = "2021"
description = "Superfast, lightweight native Markdown viewer for Windows (powered by WebView2 & mdvu-core)"
license = "MIT"

[[bin]]
name = "mdvu"
path = "src/main.rs"

[dependencies]
mdvu-core = { path = "../core" }
tao = "0.37.1"
wry = "0.57.0"
notify = "8.2.0"
rfd = "0.17.2"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
dunce = "1.0.5"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

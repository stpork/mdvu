[package]
name = "mdvu-windows"
version = "0.5.0"
edition = "2021"
description = "Superfast, lightweight native Markdown viewer for Windows (powered by WebView2 & mdvu-core)"
license = "MIT"

[[bin]]
name = "mdvu"
path = "src/main.rs"

[dependencies]
mdvu-core = { path = "../core" }
tao = "0.30"
wry = "0.47"
notify = "6.1"
rfd = "0.15"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
dunce = "1.0"
url = "2.5"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.33"
windows = "0.58"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

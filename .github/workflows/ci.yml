name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # macOS Runner: AppKit GUI, WebKit, Rust Core FFI, Universal Packaging
  # =========================================================================
  macos:
    name: macOS (Tests & Release Build)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          fi
          echo "Active Developer Directory: $(xcode-select -p)"
          swift --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust Core Unit Tests
        run: cargo test --workspace --verbose

      - name: Run Swift & AppKit Test Suite
        run: |
          set -o pipefail
          mkdir -p test-results
          make test 2>&1 | tee test-results/tests.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-macos
          path: test-results/
          retention-days: 7

      - name: Build Application Bundle
        run: make app

      - name: Validate Binary & Code Signature
        run: |
          BINARY="dist/mdvu.app/Contents/MacOS/mdvu"
          file "$BINARY"
          codesign -v --deep --strict dist/mdvu.app
          SIZE=$(stat -f %z "$BINARY")
          echo "Binary size: $SIZE bytes"
          test $SIZE -lt 2097152

      - name: Test Headless CLI Functionality
        run: |
          CLI="dist/mdvu.app/Contents/MacOS/mdvu"
          $CLI --help
          $CLI --version
          $CLI README.md -o /tmp/cli-output.html --standalone
          test -f /tmp/cli-output.html
          $CLI README.md --toc | grep -q "why-mdvu"
          cat README.md | $CLI - --stdout | grep -q "MDVu"

      - name: Run Performance Benchmark
        run: make benchmark

      - name: Package Universal Release
        run: make archive

      - name: Upload macOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdvu-macos-release
          path: |
            dist/mdvu-*.zip
            dist/mdvu-*.zip.sha256
            dist/mdvu-*.dmg
            dist/mdvu-*.dmg.sha256
            dist/mdvu.rb
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # Windows Runner: Win32, WebView2, Rust Core, Standalone Packaging
  # =========================================================================
  windows:
    name: Windows (Tests & Release Build)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust Workspace Tests
        run: cargo test --workspace --verbose

      - name: Build Windows Release Binary
        run: cargo build --release -p mdvu-windows --bin mdvu

      - name: Package Windows Release Archive
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Validate Windows Artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/windows/mdvu.exe")) {
            throw "dist/windows/mdvu.exe was not created"
          }
          $zip = Get-ChildItem "dist" -Filter "mdvu-*-windows-x86_64.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Release zip archive not found in dist/"
          }
          Write-Host "Found release zip: $($zip.FullName)"

      - name: Test Windows Headless CLI Functionality
        shell: pwsh
        run: |
          $exe = "dist/windows/mdvu.exe"
          & $exe --help
          & $exe --version
          & $exe README.md -o dist/test-output.html --standalone
          if (-not (Test-Path "dist/test-output.html")) {
            throw "CLI HTML output was not generated"
          }
          $toc = & $exe README.md --toc
          if ($toc -notmatch "why-mdvu") {
            throw "CLI TOC JSON extraction failed"
          }
          Write-Host "Windows CLI tests passed successfully" -ForegroundColor Green

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdvu-windows-x86_64
          path: |
            dist/mdvu-*-windows-x86_64.zip
            dist/*.sha256
          if-no-files-found: ignore
          retention-days: 14
